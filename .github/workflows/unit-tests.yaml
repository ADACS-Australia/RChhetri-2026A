name: Unit Tests

on: [push]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-26.04]

    steps:
      - name: Checkout ${{ matrix.python-version }}
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update

          uv venv --python ${{ matrix.python-version }} /tmp/venv
          source /tmp/venv/bin/activate

          uv pip install .[tests]
          uv pip freeze --system # for debugging

      - name: Run unit tests with coverage
        run: |
          source /tmp/venv/bin/activate
          pytest -v .
