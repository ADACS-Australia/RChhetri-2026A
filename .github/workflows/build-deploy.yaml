name: build-and-deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-26.04]

    steps:
      - uses: actions/checkout@v4

      - name: Get version tag
        id: version
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          pip install build
          python -m build --wheel

      - name: Ensure gh CLI is available
        run: |
          type -p gh >/dev/null || (
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          )

      - name: Build and base Docker image
        run: |
          ls -ltrh container
          docker build -t needle-base:${{ steps.version.outputs.tag }} -f container/base.Dockerfile .

      - name: Build Needle image
        run: |
          docker build \
            --build-arg BASE_IMAGE=needle-base \
            --build-arg BASE_VERSION=${{ steps.version.outputs.tag }} \
            -t needle:${{ steps.version.outputs.tag }} -f container/needle.Dockerfile .

      - name: Install Apptainer
        run: |
          sudo apt-get update
          if apt-cache show libfuse3-4 >/dev/null 2>&1; then
            sudo apt-get install -y libfuse3-4
            DEB_SUFFIX="-trixie+"
          else
            sudo apt-get install -y libfuse3-3
            DEB_SUFFIX=""
          fi
          wget https://github.com/apptainer/apptainer/releases/download/v1.4.2/apptainer_1.4.2_amd64.deb
          sudo apt-get install -y ./apptainer_1.4.2_amd64.deb

      - name: Convert image to SIF
        run: apptainer build needle.sif docker-daemon://needle:${{ steps.version.outputs.tag }}

      - name: Create release
        run: |
          gh release delete ${{ steps.version.outputs.tag }} --yes --cleanup-tag || true
          gh release create ${{ steps.version.outputs.tag }} dist/*.whl --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Push SIF to GHCR
        run: |
          IMAGE_PATH=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "${{ github.token }}" | apptainer registry login -u ${{ github.actor }} --password-stdin oras://ghcr.io
          apptainer push needle.sif oras://ghcr.io/${IMAGE_PATH}:${{ steps.version.outputs.tag }}

      - name: Trigger Prefect flow
        run: |
          curl -X POST "${{ secrets.PREFECT_WEBHOOK_URL }}" \
            -u "${{ secrets.PREFECT_AUTH_STRING }}" \
            -H "Content-Type: application/json" \
            -d '{"release_tag": "${{ steps.version.outputs.tag }}", "image_tag": "${{ steps.version.outputs.tag }}"}'
