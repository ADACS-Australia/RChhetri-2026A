name: needle
prefect-version: 3.0.0

# How the worker gets the code (shared by every deployment below)
pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/ADACS-Australia/RChhetri-2026A.git
      branch: casda_pull
  - prefect.deployments.steps.run_shell_script:
      directory: "{{ clone-step.directory }}"
      script: bash scripts/install_dependencies.sh
      stream_output: true

deployments:
  # This deployment is triggered by the casda-query flow via run_deployment().
  - name: download-observation-ozstar
    description: Download CASDA visibilities for a target observation and its calibrator
    entrypoint: needle/flows/download_observation.py:download_observation
    work_pool:
      name: "download-observation-ozstar"

  # This deployment is triggered by download-observation when a target is ready.
  - name: needle-pipeline-ozstar
    description: Run the needle pipeline for an available observation
    entrypoint: needle/flows/pipeline.py:needle_pipeline
    work_pool:
      name: "process-observation-ozstar"
